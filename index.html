<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIH Hall Display</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #161b22;
      font-size: 1.5rem;
      border-bottom: 2px solid #30363d;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 30px;
      text-align: center;
    }

    /* --- TIMER DISPLAY --- */
    .timer-box { 
      text-align: center; 
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    .timer-label { font-size: 2rem; color: #8b949e; text-transform: uppercase; letter-spacing: 2px; }
    .timer-display { font-size: 9rem; font-weight: 800; color: #3fb950; font-family: monospace; }

    /* --- SESSION DISPLAY (NO COUNTDOWN MODE) --- */
    .session-box {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.6s ease-in-out;
    }
    .session-badge {
      background: #238636;
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 15px;
      box-shadow: 0 0 15px rgba(35, 134, 54, 0.4);
    }
    .session-title {
      font-size: 4.5rem;
      font-weight: 800;
      color: #58a6ff;
      margin-bottom: 15px;
      text-shadow: 0 4px 20px rgba(88, 166, 255, 0.2);
    }
    .session-subtitle {
      font-size: 2rem;
      color: #8b949e;
      max-width: 800px;
    }

    /* --- IMAGE / BANNER DISPLAY --- */
    .image-box {
      width: 100%;
      height: 0;
      opacity: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .image-box img {
      max-width: 90%;
      max-height: 50vh;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    /* --- MODE STATES --- */
    /* 1. Session Mode Active (Timer Hidden) */
    body.mode-session .timer-box { display: none; }
    body.mode-session .session-box { display: flex; }

    /* 2. Notification Overlay Active */
    body.has-notification .main-content { justify-content: flex-start; }
    body.has-notification .timer-label { font-size: 1rem; }
    body.has-notification .timer-display { font-size: 3.5rem; color: #d29922; }
    body.has-notification .session-title { font-size: 2.8rem; }
    body.has-notification .session-subtitle { font-size: 1.3rem; }
    body.has-notification .image-box { height: 50vh; opacity: 1; margin-top: 15px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <span><b>SIH 2026</b> | HACKATHON HALL</span>
    <span id="actual-time">00:00:00 AM</span>
  </div>

  <div class="main-content">
    <!-- Countdown Timer View -->
    <div class="timer-box" id="timer-box">
      <div class="timer-label" id="timer-status">Hacking Ends In</div>
      <div class="timer-display" id="countdown">00:00:00</div>
    </div>

    <!-- Session View (No Countdown) -->
    <div class="session-box" id="session-box">
      <div class="session-badge" id="session-badge">EVENTS IN PROGRESS</div>
      <div class="session-title" id="session-title">INAGURATION CEREMONY</div>
      <div class="session-subtitle" id="session-subtitle">Please be seated in the Main Auditorium</div>
    </div>

    <!-- Image / Notification View -->
    <div class="image-box" id="image-box">
      <img id="feed-image" src="" alt="Notification Banner">
    </div>
  </div>

  <script>
    const CHANNEL_NAME = "sih2026_hall_display_channel_98765";

    function getDefault10AM() {
      const target = new Date();
      target.setHours(10, 0, 0, 0);
      if (Date.now() > target.getTime()) {
        target.setDate(target.getDate() + 1);
      }
      return target.getTime();
    }

    // Persistent State Logic
    let appState = JSON.parse(localStorage.getItem('sih_app_state')) || {
      mode: 'timer', // 'timer' or 'session'
      targetTime: getDefault10AM(),
      sessionBadge: 'EVENT IN PROGRESS',
      sessionTitle: 'WELCOME TO SIH 2026',
      sessionSubtitle: 'Main Auditorium',
      activeImage: ''
    };

    function renderUI() {
      // 1. Toggle Mode (Timer vs Session)
      if (appState.mode === 'session') {
        document.body.classList.add('mode-session');
        document.getElementById('session-badge').innerText = appState.sessionBadge || 'EVENT IN PROGRESS';
        document.getElementById('session-title').innerText = appState.sessionTitle || 'SESSION IN PROGRESS';
        document.getElementById('session-subtitle').innerText = appState.sessionSubtitle || '';
      } else {
        document.body.classList.remove('mode-session');
      }

      // 2. Handle Image Notification Overlay
      if (appState.activeImage && appState.activeImage !== "") {
        document.getElementById('feed-image').src = appState.activeImage;
        document.body.classList.add('has-notification');
      } else {
        document.body.classList.remove('has-notification');
      }
    }

    // Initial UI render
    renderUI();

    // 1. Live Clock Display
    setInterval(() => {
      document.getElementById('actual-time').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // 2. Precise Countdown Logic
    setInterval(() => {
      if (appState.mode === 'timer') {
        const diff = Math.max(0, appState.targetTime - Date.now());
        const hrs = String(Math.floor(diff / 3600000)).padStart(2, '0');
        const mins = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
        const secs = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        document.getElementById('countdown').innerText = `${hrs}:${mins}:${secs}`;
      }
    }, 1000);

    // 3. Real-time Cloud SSE Listener
    const eventSource = new EventSource(`https://ntfy.sh/${CHANNEL_NAME}/sse`);
    
    eventSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.event !== "message") return;

        const payload = JSON.parse(data.message);

        // Update App State
        if (payload.mode) appState.mode = payload.mode;
        if (payload.targetTime) appState.targetTime = payload.targetTime;
        if (payload.sessionBadge !== undefined) appState.sessionBadge = payload.sessionBadge;
        if (payload.sessionTitle !== undefined) appState.sessionTitle = payload.sessionTitle;
        if (payload.sessionSubtitle !== undefined) appState.sessionSubtitle = payload.sessionSubtitle;
        if (payload.activeImage !== undefined) appState.activeImage = payload.activeImage;

        // Save to browser cache & update view
        localStorage.setItem('sih_app_state', JSON.stringify(appState));
        renderUI();
      } catch(e) {
        console.error("Error parsing payload:", e);
      }
    };
  </script>
</body>
</html>
